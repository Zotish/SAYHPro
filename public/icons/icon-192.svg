<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <!-- Inner shadow overlay -->
  <rect width="192" height="192" rx="42" fill="none" stroke="#6EE7B7" stroke-width="3" stroke-opacity="0.3" />
  
  <!-- Stylized Retail / Store / SaaS Symbol -->
  <g transform="translate(40, 36)">
    <!-- Store Roof -->
    <path d="M56 12 L96 44 L16 44 Z" fill="url(#iconGrad)" />
    <!-- Pillars -->
    <rect x="22" y="48" width="14" height="48" rx="4" fill="#FFFFFF" opacity="0.9" />
    <rect x="49" y="48" width="14" height="48" rx="4" fill="#FFFFFF" opacity="0.9" />
    <rect x="76" y="48" width="14" height="48" rx="4" fill="#FFFFFF" opacity="0.9" />
    <!-- Store Base -->
    <rect x="12" y="98" width="88" height="14" rx="4" fill="url(#iconGrad)" />
    <!-- Star Accent -->
    <circle cx="56" cy="32" r="5" fill="#FBBF24" />
  </g>
</svg>
